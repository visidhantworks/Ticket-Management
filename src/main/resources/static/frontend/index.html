<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Management Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginScreen" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">TM</div>
      <p class="eyebrow">TICKET MANAGEMENT</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in once. Your role decides which dashboard you see.</p>

      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />

        <label>Password</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="togglePassword" class="icon-btn">Show</button>
        </div>

        <button class="primary-btn full" type="submit" id="loginBtn">Sign in</button>
        <p id="loginError" class="error"></p>
      </form>

      <div class="demo-box">
        <strong>Demo accounts</strong>
        <span>Requestor: requestor@test.com / Requestor@123</span>
        <span>Support: support@test.com / Support@123</span>
      </div>
    </div>
  </section>

  <section id="appScreen" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-mark small">TM</div><div><strong>TicketDesk</strong><small>Operations Portal</small></div></div>
      <nav id="sidebarNav"></nav>
      <button id="logoutBtn" class="logout-btn">↪ <span>Logout</span></button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">DASHBOARD</p><h2 id="pageTitle">Dashboard</h2></div>
        <div class="user-chip"><div id="userInitial" class="avatar">U</div><div><strong id="userEmail">User</strong><span id="userRole">ROLE</span></div></div>
      </header>
      <div id="pageContent"></div>
    </main>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
 <script src="js/app.js"></script>

 
</body>
</html>
